[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-sensory-music-preprocessor"
version = "0.2.0"
description = "Automatic offline music analysis with synchronized event and description timelines"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10", "librosa>=0.10.2,<0.12", "soundfile>=0.12", "jsonschema>=4.18"]

[project.optional-dependencies]
neural = ["torch==2.5.1", "torchaudio==2.5.1", "demucs>=4,<5", "beat-this>=1,<3", "basic-pitch==0.4.0", "onnxruntime>=1.17", "torchcrepe>=0.0.23", "setuptools<81"]
emotion = ["torch==2.5.1", "torchaudio==2.5.1", "transformers==4.44.2", "pytorch-lightning>=2,<3", "scikit-learn", "pretty-midi", "mir_eval", "music21>=9,<10", "hydra-core", "gradio>=4,<5"]
tags = ["essentia-tensorflow==2.1b6.dev1389"]

[project.scripts]
musicprep = "musicprep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
