name: Basic audio preparation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run synthetic-audio tests
        run: python -m unittest discover -s tests -v
      - name: Validate configuration JSON
        run: python -m json.tool config/pipeline.example.json > /dev/null
